<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>寰球智投 · 登录</title>
<link rel="stylesheet" href="/css/app.css?v=2.1.3">
<style>
  .auth-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .auth-card {
    width: min(420px, 100%);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 34px 30px 30px;
  }
  .auth-brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .auth-brand b {
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .auth-brand span {
    font-size: 11px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .auth-sub {
    margin: 0 0 24px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    padding: 4px;
    margin-bottom: 22px;
    background: rgba(148, 163, 184, 0.08);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .auth-tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 14px;
    padding: 9px 0;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .auth-tab.is-active {
    background: rgba(56, 189, 248, 0.14);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.3);
  }
  .auth-field {
    display: block;
    margin-bottom: 14px;
  }
  .auth-field > span {
    display: block;
    margin-bottom: 7px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .auth-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: rgba(7, 11, 18, 0.72);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-field input:focus {
    border-color: rgba(56, 189, 248, 0.62);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
  }
  .auth-submit {
    width: 100%;
    margin-top: 6px;
    padding: 13px 0;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #04121c;
    background: linear-gradient(135deg, var(--accent), #7dd3fc);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  .auth-submit:hover { filter: brightness(1.06); }
  .auth-submit:active { transform: translateY(1px); }
  .auth-submit[disabled] { filter: grayscale(0.5) opacity(0.65); cursor: default; }
  .auth-msg {
    min-height: 20px;
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--up);
  }
  .auth-msg.ok { color: var(--down); }
  .auth-hint {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
  }
  .auth-hint code {
    color: var(--gold);
    font-family: var(--num);
  }
</style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand"><b>寰球智投</b><span>Global Pulse</span></div>
      <p class="auth-sub">登录后可管理自己的自选股票、基金与持仓，数据按账号隔离。</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-mode="login" role="tab">登录</button>
        <button type="button" class="auth-tab" data-mode="register" role="tab">注册</button>
        <button type="button" class="auth-tab" data-mode="change" role="tab">修改密码</button>
      </div>

      <form id="authForm" autocomplete="on" novalidate>
        <label class="auth-field">
          <span>用户名</span>
          <input id="username" name="username" type="text" maxlength="20" autocomplete="username"
                 placeholder="3-20 位中文 / 字母 / 数字 / 下划线" required>
        </label>
        <label class="auth-field">
          <span id="passwordLabel">密码</span>
          <input id="password" name="password" type="password" maxlength="64" autocomplete="current-password"
                 placeholder="至少 6 位" required>
        </label>
        <label class="auth-field" id="newPasswordRow" hidden>
          <span>新密码</span>
          <input id="newPassword" name="newPassword" type="password" maxlength="64" autocomplete="new-password"
                 placeholder="至少 6 位，不能与原密码相同">
        </label>
        <label class="auth-field" id="confirmRow" hidden>
          <span>确认密码</span>
          <input id="confirm" name="confirm" type="password" maxlength="64" autocomplete="new-password"
                 placeholder="再输入一次">
        </label>
        <button type="submit" class="auth-submit" id="submitBtn">登录</button>
        <div class="auth-msg" id="authMsg" role="alert" aria-live="polite"></div>
      </form>

      <div class="auth-hint">
        第一个注册的账号是<b>主账号</b>，会继承现有的自选基金与持仓，并继续使用 <code>14:30 / 19:30</code> 的微信推送；
        之后注册的账号各自保存自己的持仓，互不影响。<br>
        忘记密码请联系管理员在后台重置；管理员入口在 <a href="/admin.html" style="color:var(--accent)">后台管理</a>。
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var mode = 'login';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('authForm');
  var btn = $('submitBtn');
  var msg = $('authMsg');
  var confirmRow = $('confirmRow');
  var newPasswordRow = $('newPasswordRow');
  var passwordLabel = $('passwordLabel');

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.auth-tab').forEach(function (t) {
      t.classList.toggle('is-active', t.dataset.mode === mode);
    });
    confirmRow.hidden = mode === 'login';
    newPasswordRow.hidden = mode !== 'change';
    passwordLabel.textContent = mode === 'change' ? '原密码' : '密码';
    btn.textContent = mode === 'register' ? '注册并登录' : mode === 'change' ? '确认修改' : '登录';
    btn.disabled = false;
    $('password').setAttribute('autocomplete', mode === 'register' ? 'new-password' : 'current-password');
    show('', false);
    $('username').focus();
  }

  function show(text, ok) {
    msg.textContent = text || '';
    msg.classList.toggle('ok', !!ok);
  }

  function goHome() {
    var target = '/';
    try {
      var back = new URLSearchParams(location.search).get('next');
      if (back && back.charAt(0) === '/' && back.charAt(1) !== '/') target = back;
    } catch (e) { /* 忽略 */ }
    location.replace(target);
  }

  function request(path, payload) {
    btn.disabled = true;
    show('', false);
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ('请求失败 (' + res.status + ')'));
          return data;
        });
      })
      .catch(function (err) {
        show(err.message || '网络错误，请稍后重试', false);
        btn.disabled = false;
        throw err;
      });
  }

  function submitLogin(payload) {
    return request('/api/auth/' + mode, payload).then(function () {
      show(mode === 'register' ? '注册成功，正在进入…' : '登录成功，正在进入…', true);
      setTimeout(goHome, 220);
    }).catch(function () { /* 错误已显示 */ });
  }

  function submitChange() {
    var username = $('username').value.trim();
    var oldPassword = $('password').value;
    var newPassword = $('newPassword').value;
    return request('/api/auth/password', { username: username, oldPassword: oldPassword, newPassword: newPassword })
      .then(function () {
        show('密码已修改，请用新密码登录', true);
        $('password').value = '';
        $('newPassword').value = '';
        $('confirm').value = '';
        setTimeout(function () { setMode('login'); }, 1200);
      }).catch(function () { /* 错误已显示 */ });
  }

  document.querySelectorAll('.auth-tab').forEach(function (t) {
    t.addEventListener('click', function () { setMode(t.dataset.mode); });
  });

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var username = $('username').value.trim();
    var password = $('password').value;
    if (username.length < 3) { show('用户名至少 3 位'); return; }
    if (password.length < 6) { show('密码至少 6 位'); return; }

    if (mode === 'change') {
      var newPassword = $('newPassword').value;
      if (newPassword.length < 6) { show('新密码至少 6 位'); return; }
      if (newPassword !== $('confirm').value) { show('两次输入的新密码不一致'); return; }
      if (newPassword === password) { show('新密码不能与原密码相同'); return; }
      submitChange();
      return;
    }

    if (mode === 'register' && password !== $('confirm').value) { show('两次输入的密码不一致'); return; }
    submitLogin({ username: username, password: password });
  });

  var params = new URLSearchParams(location.search);
  if (params.get('changed') === '1') {
    show('密码已修改，请用新密码登录', true);
  }
  if (params.get('mode') === 'change') setMode('change');

  // 已登录且不是来改密码的，就直接进首页，省一次输入。
  if (mode !== 'change' && params.get('changed') !== '1') {
    fetch('/api/auth/me', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.user) goHome(); })
      .catch(function () { /* 离线时留在登录页 */ });
  }
})();
</script>
</body>
</html>
